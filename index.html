<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MISS THAILAND BANGKOK 2027 — THE NEW CROWN OF BANGKOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@300;400;500;600;700&family=Sarabun:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pearl:#F8F6F2;
  --beige:#E8DED0;
  --gold:#C9A86A;
  --gold-line:rgba(201,168,106,.55);
  --rose:#D8A7A7;
  --burgundy:#521F2B;
  --burgundy-deep:#3B1520;
  --navy:#111827;
  --navy-card:#182033;
  --ink:#111827;
  --ink-soft:#5b5f6b;
  --line:rgba(17,24,39,0.12);
  --line-on-dark:rgba(248,246,242,0.14);
  --font-display:'Trirong', serif;
  --font-body:'Sarabun', sans-serif;
  --radius-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --pearl:#111827; --beige:#182033; --ink:#F8F6F2; --ink-soft:#b7bccb; --line:rgba(248,246,242,0.14); }
}
:root[data-theme="dark"]{ --pearl:#111827; --beige:#182033; --ink:#F8F6F2; --ink-soft:#b7bccb; --line:rgba(248,246,242,0.14); }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--pearl);color:var(--ink);font-family:var(--font-body);font-weight:400;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--bn-h) + var(--sb-h));}
h1,h2,h3,h4,.serif{font-family:var(--font-display);font-weight:600;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px;}
.overflow-x{overflow-x:auto;}
.muted{color:var(--ink-soft);}
.center{text-align:center;}
svg.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#app{animation:fadeUp .5s ease both;}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){ #app{animation:none;} }

/* ---------------- motif svgs ---------------- */
.motif-skyline{position:absolute;left:0;right:0;bottom:0;height:auto;pointer-events:none;}
.motif-skyline svg{width:100%;display:block;}
.motif-kanok{position:absolute;pointer-events:none;}
.motif-lotus{display:inline-flex;}
.motif-crown-big{position:absolute;pointer-events:none;}

/* ---------------- sponsor bar (bottom, above bottom-nav) ---------------- */
:root{ --bn-h:64px; --sb-h:68px; }
.sponsor-bar{position:fixed;left:0;right:0;bottom:var(--bn-h);z-index:59;background:var(--pearl);border-top:1px solid var(--gold-line);height:var(--sb-h);display:flex;align-items:center;}
.sponsor-bar-inner{max-width:1200px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;justify-content:flex-start;gap:18px;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;}
.sponsor-bar-label{font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;flex:none;}
.sponsor-bar-item{display:flex;align-items:center;gap:8px;flex:none;}
.sponsor-bar-item .divider{width:1px;height:24px;background:var(--line);flex:none;margin:0 6px;}
.sponsor-bar img{height:32px;width:auto;display:block;object-fit:contain;}
.sponsor-bar img.big{height:48px;}
.sponsor-bar .sb-name{font-family:var(--font-display);font-size:13px;color:var(--navy);white-space:nowrap;}
@media(min-width:700px){ .sponsor-bar-inner{gap:30px;} .sponsor-bar img{height:38px;} .sponsor-bar img.big{height:60px;} }
@media(min-width:940px){ .bottom-nav{display:none;} .sponsor-bar{bottom:0;} body{padding-bottom:var(--sb-h) !important;} }

/* ---------------- topbar ---------------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(248,246,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);color:var(--ink);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;max-width:1200px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:26px;height:22px;flex:none;color:var(--gold);}
.brand-name{font-family:var(--font-display);font-size:16px;line-height:1.15;letter-spacing:.03em;}
.brand-name small{display:block;font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--ink-soft);margin-top:3px;}
.nav-desktop{display:none;gap:24px;font-size:13px;letter-spacing:.02em;}
.nav-desktop a{position:relative;padding:4px 0;color:var(--ink-soft);}
.nav-desktop a.active{color:var(--burgundy);}
.nav-desktop a.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--gold);}
.top-actions{display:flex;align-items:center;gap:10px;}
.admin-icon-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--ink-soft);flex:none;}
.admin-icon-btn:hover{border-color:var(--gold);color:var(--burgundy);}
.admin-icon-btn svg{width:16px;height:16px;}
.lang-toggle{display:flex;border:1px solid var(--gold-line);border-radius:var(--radius-pill);overflow:hidden;font-size:11px;letter-spacing:.04em;}
.lang-toggle span{padding:6px 12px;color:var(--ink-soft);}
.lang-toggle span.on{background:var(--burgundy);color:var(--pearl);}
.nav-cta{display:none;}
@media(min-width:940px){.nav-desktop{display:flex;}.nav-cta{display:inline-flex;}}

/* ---------------- bottom nav ---------------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy);border-top:1px solid var(--line-on-dark);display:flex;align-items:center;justify-content:space-around;height:var(--bn-h);box-sizing:border-box;padding:6px 4px;}
@media(min-width:940px){.bottom-nav{display:none;}body{padding-bottom:0;}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(248,246,242,.6);font-size:9.5px;flex:1;padding:2px 0;}
.bn-item.active{color:var(--gold);}
.bn-item.vote-item{color:var(--gold);}
.bn-item svg{width:19px;height:19px;}

/* ---------------- buttons ---------------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;font-size:13.5px;letter-spacing:.03em;border:1px solid transparent;border-radius:var(--radius-pill);transition:all .25s;font-family:var(--font-body);}
.btn-primary{background:var(--burgundy);color:var(--pearl);}
.btn-primary:hover{background:var(--gold);color:var(--navy);}
.btn-outline-gold{background:transparent;border-color:var(--gold);color:var(--navy);}
.btn-outline-gold:hover{background:var(--gold);color:var(--navy);}
.btn-outline-gold-onDark{background:transparent;border-color:var(--gold-line);color:var(--pearl);}
.btn-outline-gold-onDark:hover{border-color:var(--gold);color:var(--gold);}
.btn-onDark{background:var(--pearl);color:var(--burgundy);}
.btn-onDark:hover{background:var(--gold);color:var(--navy);}
.btn-sm{padding:8px 16px;font-size:12px;}
.btn-row{display:flex;flex-wrap:wrap;gap:14px;}

/* ---------------- hero ---------------- */
.hero{position:relative;background:linear-gradient(180deg,var(--pearl) 0%, var(--beige) 100%);overflow:hidden;padding:88px 0 64px;}
.hero .motif-crown-big{top:-40px;right:-40px;width:280px;opacity:.07;color:var(--navy);}
.hero .motif-skyline{opacity:.14;color:var(--navy);height:90px;}
.hero-inner{position:relative;max-width:1200px;margin:0 auto;padding:0 22px;}
.hero-eyebrow{color:var(--burgundy);font-size:12.5px;letter-spacing:.16em;margin-bottom:18px;font-weight:600;}
.hero h1{font-size:clamp(42px,9vw,92px);line-height:.98;margin:0 0 6px;font-weight:600;color:var(--navy);}
.hero .sub{font-family:var(--font-display);font-size:clamp(14px,2vw,19px);letter-spacing:.22em;color:var(--gold);margin:10px 0 26px;font-weight:500;}
.hero p.lead{max-width:440px;font-size:16.5px;color:var(--ink-soft);margin:0 0 34px;font-weight:300;}
.gold-rule{width:64px;height:1px;background:var(--gold);margin:26px 0;}
.countdown{display:flex;gap:26px;padding-top:26px;border-top:1px solid var(--line);max-width:560px;}
.cd-unit{text-align:left;}
.cd-num{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);color:var(--navy);font-variant-numeric:tabular-nums;font-weight:500;}
.cd-label{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin-top:4px;}

/* ---------------- sections ---------------- */
section{padding:78px 0;position:relative;}
.section-head{max-width:600px;margin:0 auto 46px;text-align:center;}
.section-head.left{text-align:left;margin-left:0;}
.section-head .kicker{color:var(--burgundy);font-size:12px;letter-spacing:.16em;margin-bottom:14px;font-weight:600;}
.section-head h2{font-size:clamp(27px,4vw,40px);margin:0 0 16px;font-weight:600;color:var(--navy);}
.section-head p{color:var(--ink-soft);font-size:15px;margin:0;font-weight:300;}
.section-beige{background:var(--beige);}
.section-navy{background:var(--navy);color:var(--pearl);}
.section-navy .section-head p{color:rgba(248,246,242,.68);}
.section-navy .section-head h2{color:#fff;}
.section-navy .kicker{color:var(--gold);}
.section-burgundy{background:var(--burgundy);color:var(--pearl);}
.section-burgundy .section-head p{color:rgba(248,246,242,.75);}
.section-burgundy .section-head h2{color:#fff;}
.section-burgundy .kicker{color:var(--gold);}

/* ---------------- grid ---------------- */
.grid{display:grid;gap:26px;}
.grid-3{grid-template-columns:repeat(1,1fr);}
@media(min-width:640px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(min-width:980px){.grid-3{grid-template-columns:repeat(3,1fr);}}
.grid-4{grid-template-columns:repeat(2,1fr);}
@media(min-width:900px){.grid-4{grid-template-columns:repeat(4,1fr);}}

/* ---------------- editorial contestant card ---------------- */
.contestant-card{position:relative;}
.cc-portrait{aspect-ratio:4/5;position:relative;overflow:hidden;background:var(--beige);}
.cc-portrait .fill{position:absolute;inset:0;transition:transform .6s ease;}
.contestant-card:hover .cc-portrait .fill{transform:scale(1.06);}
.cc-portrait .ring{width:56%;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;}
.cc-portrait .initials{font-family:var(--font-display);font-size:30px;color:var(--navy);font-weight:500;}
.cc-portrait .num{position:absolute;top:14px;left:14px;font-family:var(--font-display);font-size:22px;color:var(--navy);opacity:.85;}
.cc-portrait .badge{position:absolute;top:14px;right:14px;font-size:9px;letter-spacing:.1em;border:1px solid var(--gold);color:var(--navy);padding:3px 9px;background:rgba(248,246,242,.7);}
.cc-goldline{height:1px;background:var(--line);position:relative;overflow:hidden;}
.cc-goldline::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .5s ease;}
.contestant-card:hover .cc-goldline::after{transform:scaleX(1);}
.cc-body{padding:16px 2px 0;}
.cc-name{font-family:var(--font-display);font-size:18px;margin:0 0 3px;font-weight:600;color:var(--navy);transition:color .3s;}
.contestant-card:hover .cc-name{color:var(--burgundy);}
.cc-meta{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 14px;text-transform:uppercase;}
.cc-actions{display:flex;gap:8px;}
.cc-actions .btn{flex:1;justify-content:center;text-align:center;}
.mk-1{background:linear-gradient(160deg,#F1E9DC,#D8A7A7);}
.mk-2{background:linear-gradient(160deg,#ECE3D3,#C9A86A);}
.mk-3{background:linear-gradient(160deg,#E8DED0,#F8F6F2);}
.mk-4{background:linear-gradient(160deg,#F1E9DC,#E8DED0);}

/* ---------------- timeline ---------------- */
.timeline{position:relative;padding-left:34px;border-left:1px solid var(--gold-line);max-width:680px;margin:0 auto;}
.tl-item{position:relative;padding-bottom:40px;}
.tl-item::before{content:"";position:absolute;left:-45px;top:2px;width:26px;height:26px;background:var(--pearl);}
.tl-item .tl-icon{position:absolute;left:-45px;top:0;width:26px;height:26px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);}
.section-navy .tl-item .tl-icon,.section-burgundy .tl-item .tl-icon{background:transparent;}
.tl-item .tl-icon svg{width:13px;height:13px;}
.tl-item h4{margin:0 0 5px;font-size:18px;color:var(--navy);}
.section-navy .tl-item h4,.section-burgundy .tl-item h4{color:#fff;}
.tl-item .tl-meta{font-size:11.5px;color:var(--burgundy);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;}
.section-navy .tl-item .tl-meta,.section-burgundy .tl-item .tl-meta{color:var(--gold);}
.tl-item p{margin:0;color:var(--ink-soft);font-size:14px;font-weight:300;}
.section-navy .tl-item p,.section-burgundy .tl-item p{color:rgba(248,246,242,.72);}

/* ---------------- forms ---------------- */
.card-panel{background:var(--pearl);border:1px solid var(--beige);padding:30px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--beige);background:var(--pearl);color:var(--ink);font-family:inherit;font-size:14.5px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:640px){.field-row.cols-2{grid-template-columns:1fr 1fr;}}
.steps-track{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
.step-dot{flex:1;min-width:18px;height:2px;background:var(--line);}
.step-dot.done{background:var(--gold);}
.step-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:22px;letter-spacing:.06em;text-transform:uppercase;}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft);}
.check-row input{margin-top:3px;}

/* ---------------- vote ---------------- */
.vote-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(248,246,242,.16);margin-bottom:12px;}
.vote-medal{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold);border:1px solid var(--gold);font-weight:500;}
.vote-info{flex:1;min-width:0;}
.vote-info .vn{font-size:15px;font-family:var(--font-display);font-weight:600;color:#fff;}
.vote-info .vd{font-size:11px;color:rgba(248,246,242,.6);letter-spacing:.04em;text-transform:uppercase;}
.vote-count{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:2px;}
.vote-btn{flex:none;padding:10px 20px;font-size:12px;background:var(--pearl);color:var(--burgundy);border:none;letter-spacing:.05em;border-radius:var(--radius-pill);}
.vote-btn:disabled{background:rgba(248,246,242,.3);color:rgba(59,21,32,.5);cursor:not-allowed;}
.popular-vote-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold-line);padding:5px 12px;border-radius:var(--radius-pill);margin-bottom:20px;}

/* ---------------- misc ---------------- */
.pill{display:inline-block;font-size:10.5px;letter-spacing:.08em;padding:4px 12px;border:1px solid var(--gold);color:var(--navy);border-radius:var(--radius-pill);text-transform:uppercase;}
.pill-role{padding:3px 9px;font-size:10px;border:1px solid currentColor;border-radius:var(--radius-pill);}
.news-featured{display:grid;grid-template-columns:1fr;gap:26px;margin-bottom:40px;border-bottom:1px solid var(--line);padding-bottom:40px;}
@media(min-width:800px){.news-featured{grid-template-columns:1.2fr 1fr;align-items:center;}}
.news-img{aspect-ratio:16/10;background:linear-gradient(135deg,var(--beige),var(--gold));}
.news-featured .news-img{aspect-ratio:4/3;}
.news-cat{font-size:10.5px;color:var(--burgundy);letter-spacing:.1em;text-transform:uppercase;}
.news-title{font-family:var(--font-display);font-size:17px;margin:8px 0 6px;font-weight:600;color:var(--navy);}
.news-featured .news-title{font-size:30px;}
.news-date{font-size:11.5px;color:var(--ink-soft);}
.news-list-item{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
.news-list-item .news-img{aspect-ratio:1;}
.sponsor-tier{margin-bottom:36px;}
.sponsor-tier h4{font-size:11.5px;letter-spacing:.14em;color:var(--burgundy);margin-bottom:16px;text-transform:uppercase;}
.sponsor-row{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);}
@media(min-width:700px){.sponsor-row{grid-template-columns:repeat(4,1fr);}}
.sponsor-box{padding:26px 10px;text-align:center;font-family:var(--font-display);font-size:13px;color:var(--ink-soft);background:var(--pearl);}
.gallery-grid{column-count:2;column-gap:14px;}
@media(min-width:700px){.gallery-grid{column-count:3;}}
.g-item{break-inside:avoid;margin-bottom:14px;aspect-ratio:var(--r,1);background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:12px;font-size:10.5px;letter-spacing:.06em;color:var(--navy);text-transform:uppercase;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-weight:500;color:var(--ink-soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(min-width:800px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-box{border:1px solid var(--line);padding:22px;}
.stat-num{font-family:var(--font-display);font-size:30px;color:var(--burgundy);font-weight:600;}
.stat-label{font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:.03em;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
.bar-track{flex:1;height:6px;background:var(--line);}
.bar-fill{height:100%;background:var(--gold);}

/* ---------------- award badges ---------------- */
.award-badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 14px;}
.award-ring{width:84px;height:84px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;position:relative;}
.award-ring::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:50%;}
.award-ring svg{width:30px;height:30px;color:var(--burgundy);}
.award-label{font-family:var(--font-display);font-size:13.5px;color:var(--navy);}

/* ---------------- footer ---------------- */
.footer{background:var(--navy);color:rgba(248,246,242,.75);padding:60px 0 90px;font-size:13px;position:relative;overflow:hidden;}
.footer .motif-skyline{opacity:.1;color:var(--gold);height:80px;}
@media(min-width:940px){.footer{padding-bottom:56px;}}
.footer h5{font-family:var(--font-display);color:#fff;font-size:20px;margin:0 0 8px;font-weight:600;}
.footer .tag{color:var(--gold);font-size:11.5px;letter-spacing:.1em;margin-bottom:28px;text-transform:uppercase;}
.footer-grid{display:grid;grid-template-columns:1fr;gap:32px;position:relative;}
@media(min-width:700px){.footer-grid{grid-template-columns:1.6fr 1fr 1fr;}}
.footer a{display:block;padding:5px 0;color:rgba(248,246,242,.6);}
.footer a:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid var(--line-on-dark);margin-top:38px;padding-top:20px;font-size:11.5px;color:rgba(248,246,242,.45);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;position:relative;}

.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;font-size:13px;z-index:100;border-radius:var(--radius-pill);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
@media(min-width:940px){.toast{bottom:26px;}}
.demo-flag{display:flex;align-items:flex-start;gap:10px;font-size:11.5px;color:var(--burgundy);border:1px solid var(--rose);padding:12px 16px;margin-bottom:22px;max-width:760px;}
.demo-flag svg{flex:none;margin-top:1px;color:var(--burgundy);}
.link-inline{color:var(--burgundy);border-bottom:1px solid var(--gold);}
.status-track{display:flex;gap:0;margin:28px 0 30px;}
.st-step{flex:1;text-align:center;position:relative;font-size:10px;color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase;}
.st-step::before{content:"";position:absolute;top:-16px;left:0;right:0;height:1px;background:var(--line);}
.st-step.active::before{background:var(--gold);}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;top:-20px;}
.st-step.active .st-dot{background:var(--gold);}

/* ---------------- magazine profile ---------------- */
.mag-hero{position:relative;aspect-ratio:3/4;background:var(--beige);display:flex;align-items:center;justify-content:center;overflow:hidden;}
@media(min-width:760px){.mag-hero{aspect-ratio:auto;height:100%;}}
.mag-hero .ring{width:46%;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;}
.mag-hero .initials{font-family:var(--font-display);font-size:56px;color:var(--navy);}
.mag-hero .num-big{position:absolute;top:20px;left:20px;font-family:var(--font-display);font-size:15vw;line-height:1;color:rgba(17,24,39,.08);}
@media(min-width:760px){.mag-hero .num-big{font-size:6vw;}}
.mag-section{margin-bottom:26px;}
.mag-section .kicker{font-size:11px;letter-spacing:.14em;color:var(--burgundy);margin-bottom:8px;text-transform:uppercase;}
.mag-section p{margin:0;color:var(--ink-soft);}

/* ---------------- admin ---------------- */
.admin-shell{display:flex;flex-direction:column;gap:0;}
@media(min-width:860px){.admin-shell{flex-direction:row;align-items:flex-start;gap:36px;}}
.admin-side{background:var(--navy);color:var(--pearl);padding:24px;margin-bottom:26px;}
@media(min-width:860px){.admin-side{width:230px;flex:none;position:sticky;top:86px;}}
.admin-side .who{font-family:var(--font-display);font-size:15px;margin-bottom:2px;}
.admin-side .role{font-size:11px;color:var(--gold);letter-spacing:.06em;margin-bottom:20px;text-transform:uppercase;}
.admin-tab{display:block;padding:10px 0;font-size:13px;color:rgba(248,246,242,.68);border-bottom:1px solid var(--line-on-dark);}
.admin-tab.active{color:var(--gold);}
.admin-tab:last-of-type{border-bottom:none;}
.admin-logout{margin-top:20px;font-size:12px;color:rgba(248,246,242,.5);border-top:1px solid var(--line-on-dark);padding-top:14px;display:block;}
.admin-main{flex:1;min-width:0;}
.login-box{max-width:400px;margin:0 auto;padding:38px 32px;border:1px solid var(--beige);background:var(--pearl);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;width:100%;}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-soft);padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pw-toggle:hover{color:var(--burgundy);}
.pw-toggle svg{width:18px;height:18px;}
.demo-accounts{font-size:11.5px;color:var(--ink-soft);margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}
.demo-accounts div{display:flex;justify-content:space-between;padding:3px 0;}
.role-tag{padding:2px 9px;font-size:10px;border:1px solid var(--gold);color:var(--navy);display:inline-block;border-radius:var(--radius-pill);}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px;}
@media(max-width:640px){.score-grid{grid-template-columns:repeat(2,1fr);}}
.score-grid label{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:4px;text-transform:uppercase;}
.score-grid input{width:100%;padding:7px 8px;border:1px solid var(--beige);font-size:13px;}
.audit-row{font-size:12px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
::selection{background:var(--gold);color:var(--navy);}
</style>
</head>

/* ---------------- backend API (real, when deployed on Netlify) ---------------- */
let BACKEND_ONLINE = false;      // becomes true once /api/vote answers successfully
let REMOTE_VOTES = null;         // {contestantId: totalVotes} from the server
function getDeviceId(){
  let id = localStorage.getItem("mtb_device_id");
  if(!id){ id = "d_"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("mtb_device_id", id); }
  return id;
}
async function apiGetVotes(){
  try{
    const r = await fetch("/api/vote");
    if(!r.ok) throw 0;
    const j = await r.json();
    BACKEND_ONLINE = true; REMOTE_VOTES = j.votes;
    return j.votes;
  }catch(e){ return null; }
}
async function apiCastVote(contestantId){
  try{
    const r = await fetch("/api/vote", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({contestantId, deviceId:getDeviceId()})});
    const j = await r.json().catch(()=>null);
    if(r.ok && j && j.ok){ BACKEND_ONLINE = true; REMOTE_VOTES = j.votes; return {ok:true, remaining:j.dailyFree-j.used}; }
    if(r.status===429 && j){ BACKEND_ONLINE = true; return {ok:false, quotaExceeded:true, dailyFree:j.dailyFree}; }
    throw 0;
  }catch(e){ return {ok:null}; } // null = backend unreachable, caller should fall back to local demo mode
}
async function apiSubmitApplication(data){
  try{
    const r = await fetch("/api/applications", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    const j = await r.json().catch(()=>null);
    if(r.ok && j && j.ok){ BACKEND_ONLINE = true; return j.id; }
    throw 0;
  }catch(e){ return null; }
}
async function apiAdminLogin(username, password){
  try{
    const r = await fetch("/api/admin-login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username, password})});
    const j = await r.json().catch(()=>null);
    if(r.ok && j && j.ok){ BACKEND_ONLINE = true; return j; }
    if(r.status===401){ BACKEND_ONLINE = true; return {ok:false, invalid:true}; }
    throw 0;
  }catch(e){ return {ok:false, unreachable:true}; }
}
async function apiGetApplications(token){
  try{
    const r = await fetch("/api/applications", {headers:{"x-admin-token":token}});
    const j = await r.json().catch(()=>null);
    if(r.ok && j && j.ok) return j.applications;
    throw 0;
  }catch(e){ return null; }
}
async function apiSetApplicationStatus(token, id, status){
  try{
    const r = await fetch("/api/applications", {method:"PATCH", headers:{"Content-Type":"application/json","x-admin-token":token}, body:JSON.stringify({id,status})});
    const j = await r.json().catch(()=>null);
    return Boolean(r.ok && j && j.ok);

}
async function apiGetUsers(token){
  try{

    if(r.ok && j && j.ok) return j.users;

}
async function apiCreateUser(token, data){
  try{
    const r = await fetch("/api/users", {method:"POST", headers:{"Content-Type":"application/json","x-admin-token":token}, body:JSON.stringify(data)});

function analyticsSummary(){
  const log = getAnalytics();
  const views = log.filter(e=>e.type==="pageview");
  const byPath = {};
  views.forEach(e=>{ byPath[e.path] = (byPath[e.path]||0)+1; });
  const days = new Set(views.map(e=>e.day));
  const funnel = {
    visits: views.length,
    viewedContestant: log.filter(e=>e.type==="view_contestant").length,
    startedApplication: log.filter(e=>e.type==="start_application").length,
    submittedApplication: log.filter(e=>e.type==="submit_application").length,
    voted: log.filter(e=>e.type==="vote_cast").length,
  };
  return { totalEvents:log.length, totalViews:views.length, byPath, activeDays:days.size, funnel, visitorId:getVisitorId() };
}

/* ---------------- countdown ---------------- */
const FINAL_NIGHT = new Date("2027-12-11T19:00:00+07:00");
function startCountdown(elId, onDark){
  const el=document.getElementById(elId); if(!el) return;
  function tick(){
    const diff=FINAL_NIGHT-new Date();
    if(diff<=0){ el.innerHTML=`<p class="muted">${bi("คืนตัดสิน Final Night มาถึงแล้ว","Final Night has arrived")}</p>`; return; }
    const d=Math.floor(diff/86400000), hh=Math.floor(diff/3600000)%24, mm=Math.floor(diff/60000)%60, ss=Math.floor(diff/1000)%60;
    const labels = bi(["วัน","ชม.","นาที","วินาที"],["Days","Hrs","Min","Sec"]);
    el.innerHTML=[d,hh,mm,ss].map((n,i)=>`<div class="cd-unit"><div class="cd-num" style="${onDark?'color:#fff':''}">${String(n).padStart(2,"0")}</div><div class="cd-label" style="${onDark?'color:rgba(248,246,242,.6)':''}">${labels[i]}</div></div>`).join("");
  }
  tick(); clearInterval(window.__cdInt[elId]); window.__cdInt=window.__cdInt||{}; window.__cdInt[elId]=setInterval(tick,1000);
}

const WIZ_LABELS = ()=>bi(["ข้อมูลส่วนตัว","ประวัติการศึกษา","ประสบการณ์","ความสามารถพิเศษ","คำถามสัมภาษณ์","อัปโหลดเอกสาร","ยอมรับเงื่อนไข","ตรวจสอบข้อมูล"],["Personal Info","Education","Experience","Special Talent","Interview Questions","Uploads","Terms","Review"]);
function renderWizardStep(){
  const w=window.__wizard, s=w.step, labels=WIZ_LABELS();
  const dots = labels.map((_,i)=>`<div class="step-dot ${i<s?'done':''}"></div>`).join("");
  let body="";
  if(s===1){ body=`<div class="field-row cols-2">
      <div class="field"><label>${bi("ชื่อ","First name")}</label><input id="w_fname" value="${w.data.fname||''}"></div>
      <div class="field"><label>${bi("นามสกุล","Last name")}</label><input id="w_lname" value="${w.data.lname||''}"></div>
      <div class="field"><label>${bi("ชื่อเล่น","Nickname")}</label><input id="w_nick" value="${w.data.nick||''}"></div>
      <div class="field"><label>${bi("วันเกิด","Date of birth")}</label><input type="date" id="w_dob" value="${w.data.dob||''}"></div>
      <div class="field"><label>${bi("จังหวัด / เขต","District")}</label><input id="w_dist" value="${w.data.dist||''}"></div>
      <div class="field"><label>${bi("เบอร์โทร","Phone")}</label><input id="w_phone" value="${w.data.phone||''}"></div>
      <div class="field"><label>Email</label><input type="email" id="w_email" value="${w.data.email||''}"></div>
      <div class="field"><label>LINE ID</label><input id="w_line" value="${w.data.line||''}"></div>
    </div>`; }
  else if(s===2){ body=`<div class="field"><label>${bi("สถาบันการศึกษา","Institution")}</label><input id="w_school" value="${w.data.school||''}"></div><div class="field"><label>${bi("วุฒิการศึกษา / สาขา","Degree / Major")}</label><input id="w_degree" value="${w.data.degree||''}"></div>`; }
  else if(s===3){ body=`<div class="field"><label>${bi("ประสบการณ์ที่เกี่ยวข้อง","Relevant experience")}</label><textarea id="w_exp" rows="4">${w.data.exp||''}</textarea></div>`; }
  else if(s===4){ body=`<div class="field"><label>${bi("ความสามารถพิเศษ","Special talent")}</label><input id="w_talent" value="${w.data.talent||''}"></div><div class="field"><label>${bi("อธิบายเพิ่มเติม","Tell us more")}</label><textarea id="w_talentDesc" rows="3">${w.data.talentDesc||''}</textarea></div>`; }
  else if(s===5){ body=`<div class="field"><label>${bi("ทำไมคุณจึงอยากเป็น Miss Thailand Bangkok?","Why do you want to be Miss Thailand Bangkok?")}</label><textarea id="w_q1" rows="3">${w.data.q1||''}</textarea></div><div class="field"><label>${bi("ถ้าคุณได้รับตำแหน่ง คุณอยากพัฒนากรุงเทพมหานครในเรื่องใด?","If you win, what would you improve about Bangkok?")}</label><textarea id="w_q2" rows="3">${w.data.q2||''}</textarea></div>`; }
  else if(s===6){ body=`<div class="field"><label>${bi("รูปพอร์เทรต","Portrait photo")}</label><input type="file" id="w_f1"></div><div class="field"><label>${bi("รูปเต็มตัว","Full-body photo")}</label><input type="file" id="w_f2"></div><div class="field"><label>${bi("วิดีโอแนะนำตัว","Introduction video")}</label><input type="file" id="w_f3"></div><div class="field"><label>${bi("เอกสารยืนยันตัวตน","ID document")}</label><input type="file" id="w_f4"></div>`; }
  else if(s===7){ body=`<div class="check-row"><input type="checkbox" id="w_terms" ${w.data.terms?'checked':''}><span>${bi("ข้าพเจ้ายอมรับกติกาการประกวด นโยบายความเป็นส่วนตัว และการใช้ข้อมูลตาม PDPA","I accept the pageant rules, privacy policy, and PDPA-compliant data use.")}</span></div>`; }
  else if(s===8){ body=`<div class="card-panel"><p><strong>${w.data.fname||"-"} ${w.data.lname||"-"}</strong> (${w.data.nick||"-"})</p><p class="muted">${t('district')}${w.data.dist||"-"} • ${w.data.email||"-"} • ${w.data.phone||"-"}</p><p class="muted">${t('education')}: ${w.data.school||"-"}</p><p class="muted">${t('talent')}: ${w.data.talent||"-"}</p></div><p class="muted" style="margin-top:14px">${bi("ตรวจสอบข้อมูลให้ถูกต้องก่อนกดส่งใบสมัคร","Please review before submitting.")}</p>`; }
  const nextLabel = s<8 ? bi("ถัดไป","Next") : bi("ส่งใบสมัคร","Submit Application");
  return `<div class="steps-track">${dots}</div><p class="step-label">${bi("ขั้นตอนที่","Step")} ${s} / 8 — ${labels[s-1]}</p><div class="card-panel">${body}</div>
    <div class="btn-row" style="margin-top:24px">${s>1?`<button class="btn btn-outline-gold" onclick="wizardBack()">${bi("ย้อนกลับ","Back")}</button>`:""}<button class="btn btn-primary" onclick="wizardNext()">${nextLabel}</button></div>`;
}
function collectStep(){
  const w=window.__wizard, g=id=>document.getElementById(id)?.value, s=w.step;
  if(s===1) Object.assign(w.data,{fname:g("w_fname"),lname:g("w_lname"),nick:g("w_nick"),dob:g("w_dob"),dist:g("w_dist"),phone:g("w_phone"),email:g("w_email"),line:g("w_line")});
  if(s===2) Object.assign(w.data,{school:g("w_school"),degree:g("w_degree")});
  if(s===3) Object.assign(w.data,{exp:g("w_exp")});
  if(s===4) Object.assign(w.data,{talent:g("w_talent"),talentDesc:g("w_talentDesc")});
  if(s===5) Object.assign(w.data,{q1:g("w_q1"),q2:g("w_q2")});
  if(s===7) w.data.terms = document.getElementById("w_terms")?.checked;
}
function wizardNext(){
  collectStep(); const w=window.__wizard;
  if(w.step===7 && !w.data.terms){ toast(bi("กรุณายอมรับเงื่อนไขก่อนดำเนินการต่อ","Please accept the terms to continue.")); return; }
  if(w.step<8){ w.step++; document.getElementById("wizardBox").innerHTML=renderWizardStep(); window.scrollTo(0,0); return; }
  const localId = "MTB-2027-"+Math.floor(1000+Math.random()*9000);
  apiSubmitApplication(w.data).then(remoteId=>{
    const appId = remoteId || localId;
    addApplication({id:appId, ...w.data, status:"Submitted", submittedAt:new Date().toISOString()});
    trackEvent("submit_application", appId);
    window.__wizard = {step:1,data:{}};
    location.hash = "#/apply-status/"+appId;
  });
}
function wizardBack(){ collectStep(); window.__wizard.step--; document.getElementById("wizardBox").innerHTML=renderWizardStep(); window.scrollTo(0,0); }
window.wizardNext=wizardNext; window.wizardBack=wizardBack;

    <h4 class="serif" style="font-size:15px;margin-top:30px">${bi("เพิ่มบัญชีใหม่","Add a New Account")}</h4>
    <div class="card-panel" style="max-width:480px">
      <div class="field"><label>Username</label><input id="nu_username"></div>
      <div class="field"><label>${bi("ชื่อที่แสดง","Display Name")}</label><input id="nu_name"></div>
      ${passwordField("nu_password", "Password")}
      <div class="field"><label>${bi("ระดับสิทธิ์","Role")}</label>
        <select id="nu_role">
          <option value="admin">${roleLabel("admin")}</option>
          <option value="judge">${roleLabel("judge")}</option>
          <option value="staff">${roleLabel("staff")}</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="createUser()">${bi("เพิ่มบัญชี","Add Account")}</button>
    </div>`;
}
function createUser(){
  const session = getSession();
  const username = document.getElementById("nu_username").value.trim();
  const name = document.getElementById("nu_name").value.trim();
  const password = document.getElementById("nu_password").value;
  const role = document.getElementById("nu_role").value;
  if(!username || !password){ toast(bi("กรุณากรอก Username และ Password","Please fill in username and password.")); return; }
  apiCreateUser(session.token, {username, password, name, role}).then(res=>{
    if(res.ok){
      toast(bi("เพิ่มบัญชีแล้ว","Account added."));
      logAudit({actor:session.u, action:`${bi("เพิ่มบัญชี","Added account")} ${username} (${role})`});
      router();
    } else {
      const msg = res.error==="username_taken" ? bi("Username นี้ถูกใช้แล้ว","That username is taken.")
        : res.error==="reserved_username" ? bi("ไม่สามารถใช้ชื่อนี้ได้","That username is reserved.")
        : bi("เพิ่มบัญชีไม่สำเร็จ (ต้องเชื่อมต่อระบบหลังบ้านจริงก่อน)","Could not add account (requires a live backend).");
      toast(msg);
    }
  });
}
function deleteUser(username){
  const session = getSession();
  apiDeleteUser(session.token, username).then(ok=>{
    if(ok){ toast(bi("ลบบัญชีแล้ว","Account removed.")); logAudit({actor:session.u, action:`${bi("ลบบัญชี","Removed account")} ${username}`}); router(); }
    else toast(bi("ลบไม่สำเร็จ","Could not remove account."));
  });
}
window.createUser=createUser; window.deleteUser=deleteUser;
function adminAudit(){
  const a=getAudit();
  return `<h3 class="serif" style="font-size:18px;margin-top:0">${bi("บันทึกการทำงานของระบบ","Audit Log")}</h3><p class="muted" style="margin-top:-6px">${bi("ทุกการเปลี่ยนแปลงสำคัญถูกบันทึกไว้ที่นี่","Every meaningful change is recorded here.")}</p>
    ${a.length? a.map(e=>`<div class="audit-row"><strong>${e.actor}</strong> — ${e.action} <span style="float:right">${e.time}</span></div>`).join("") : `<p class="muted">${bi("ยังไม่มีบันทึก","No entries yet.")}</p>`}`;
}

/* =========================================================
   ROUTER
   ========================================================= */
function router(){
  const hash = location.hash || "#/";
  trackEvent("pageview");
  const parts = hash.replace("#/","").split("/").filter(Boolean);
  let htmlOut = "";
  if(parts.length===0) htmlOut = pageHome();
  else if(parts[0]==="about") htmlOut = pageAbout();
  else if(parts[0]==="contestants") htmlOut = pageContestants();
  else if(parts[0]==="contestant" && parts[1]) htmlOut = pageContestantDetail(parts[1]);
  else if(parts[0]==="competition") htmlOut = pageCompetition();
  else if(parts[0]==="events") htmlOut = pageEvents();
  else if(parts[0]==="vote") htmlOut = pageVote();
  else if(parts[0]==="news") htmlOut = pageNews();
  else if(parts[0]==="gallery") htmlOut = pageGallery();
  else if(parts[0]==="sponsors") htmlOut = pageSponsors();
  else if(parts[0]==="results") htmlOut = pageResults();
  else if(parts[0]==="apply") htmlOut = pageApply();
  else if(parts[0]==="apply-status" && parts[1]) htmlOut = pageApplyStatus(parts[1]);
  else if(parts[0]==="contact") htmlOut = pageContact();
  else if(parts[0]==="admin") htmlOut = pageAdmin(parts[1]);
  else htmlOut = `<section><div class="wrap"><h2>${bi("ไม่พบหน้านี้","Page not found")}</h2><a class="link-inline" href="#/">${t("backHome")}</a></div></section>`;

  const app = document.getElementById("app");
  app.style.animation = "none"; void app.offsetWidth; app.style.animation = "";
  app.innerHTML = htmlOut;
  renderChrome();
  renderFooter();
  startCountdown("cd-hero", false);
  startCountdown("cd-final", true);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);
document.documentElement.lang = LANG;
router();
apiGetVotes().then(v=>{ if(v) router(); }); // silently upgrades to real, shared vote counts when a live backend is present
</script>
